name: iconx
description: "iconX: a pixel-art icon pack for Android launchers."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  theme:
    path: ../theme

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    # Icon sources: also read by android/app/build.gradle.kts to make the launcher resources.
    - assets/icons/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo-1024.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/logo_background-1024.png"
  adaptive_icon_foreground: "assets/icon/logo_foreground-1024.png"
